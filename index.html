<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#123c78"><meta name="description" content="ShakeHands 仕入・在庫・納品・請求 一元管理デモ"><title>ShakeHands StockFlow | 操作デモ</title>
<style>
:root{--navy:#16396c;--blue:#2469ba;--ink:#1c2e45;--muted:#708093;--line:#e4eaf2;--bg:#f4f7fb;--white:#fff;--green:#18815a;--amber:#b36d0a;--red:#c03b3b;--radius:16px}*{box-sizing:border-box}html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:var(--blue)}.shell{max-width:1200px;margin:0 auto;min-height:100dvh}.header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:21px;letter-spacing:-.6px;color:var(--navy);font-weight:800}.logo span{font-size:10px;font-weight:700;letter-spacing:2px;color:#6684a3;display:block}.header-right{display:flex;gap:8px;align-items:center}.pill{border-radius:30px;font-size:11px;font-weight:700;padding:6px 10px;background:#edf4ff;color:#2b65aa;white-space:nowrap}.pill.soft{background:#f0f2f5;color:#718096}.main{padding:22px 24px 60px}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:17px}.eyebrow{font-weight:800;letter-spacing:1.6px;font-size:10px;color:#8c9aad}.h1{font-size:25px;line-height:1.3;font-weight:800;margin:6px 0}.subtitle{color:var(--muted);font-size:12px;line-height:1.8}.roles{display:flex;background:#e9eef5;border-radius:14px;padding:5px;gap:4px;margin-bottom:21px}.role{padding:12px 8px;flex:1;border:0;border-radius:10px;color:#758499;background:none;font-weight:800;white-space:nowrap}.role.active{background:white;color:var(--navy);box-shadow:0 1px 7px #1f36531c}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 2px 10px #18385b06;min-width:0}.card + .card{margin-top:15px}.card h2{font-size:15px;margin:0 0 5px}.card-desc{font-size:12px;color:var(--muted);margin:2px 0 18px;line-height:1.7}.stat{padding:17px 18px;background:white;border-radius:14px;border:1px solid var(--line)}.stat label{font-size:11px;color:#74859a;font-weight:700}.stat .number{font-size:24px;font-weight:800;margin-top:7px;letter-spacing:-.5px}.stat .number.green{color:var(--green)}.stat .number.warn{color:var(--amber)}.stat .number.red{color:var(--red)}label.field{display:block;font-size:12px;font-weight:800;color:#44596c;margin:18px 0 7px}.input,select{width:100%;border:1px solid #d8e2ec;background:#fff;border-radius:10px;padding:13px 12px;min-height:45px;outline:none;box-shadow:none}.input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3b8bdf1b}.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.btn{background:var(--navy);color:white;border:1px solid var(--navy);padding:12px 16px;border-radius:10px;font-weight:800;min-height:44px}.btn.secondary{background:white;color:var(--navy);border:1px solid #d2dfeb}.btn.subtle{border:0;background:#eaf2fc;color:var(--blue)}.btn.small{padding:8px 10px;min-height:34px;font-size:12px}.btn.full{width:100%}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product{border:1px solid #dfe6ee;border-radius:11px;background:white;text-align:left;padding:12px;min-height:79px;display:flex;flex-direction:column;gap:6px;justify-content:center}.product .pname{font-weight:800;font-size:12px;line-height:1.4}.product .pmeta{font-size:11px;color:var(--muted)}.product.active{background:#eff6ff;border-color:#4083cf;box-shadow:0 0 0 1px #4083cf}.splitline{height:1px;background:var(--line);margin:20px 0}.qty{display:flex;border:1px solid #dce5ee;border-radius:11px;align-items:center;overflow:hidden;width:180px;height:46px}.qty button{border:0;width:47px;height:44px;font-size:21px;color:var(--navy);background:#f7faff}.qty input{width:86px;min-width:0;border:0;text-align:center;outline:none;font-size:17px;font-weight:700}.notice{display:flex;gap:10px;padding:12px 13px;border:1px solid #d3e4fa;background:#f0f7ff;color:#345e8c;font-size:12px;line-height:1.7;border-radius:11px;margin:14px 0}.notice.warn{border-color:#f3ddab;background:#fffbf1;color:#8c6117}.notice.red{border-color:#efd0d0;background:#fff7f7;color:#9d4141}.list{display:flex;flex-direction:column;gap:9px}.item{padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}.item-title{font-weight:800;font-size:12px;line-height:1.5}.item-detail{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}.tag{font-size:10px;border-radius:5px;padding:4px 6px;background:#f0f3f7;color:#587089;font-weight:800;display:inline-block;vertical-align:middle;white-space:nowrap}.tag.amber{background:#fff4df;color:#a36d0b}.tag.green{background:#e6f7ef;color:#18815a}.tag.red{background:#fff0ed;color:#ae4434}.tag.blue{background:#eaf2ff;color:#2769b0}.muted{color:var(--muted)}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:510px}.table th{font-size:11px;color:#7c8b9c;text-align:left;background:#f7f9fc;border-bottom:1px solid var(--line);padding:10px}.table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}.table tr:last-child td{border-bottom:0}.right{text-align:right}.section-label{font-size:12px;font-weight:800;color:#69809a;letter-spacing:.4px;margin:22px 0 10px}.empty{padding:28px 12px;text-align:center;background:#f8fafc;border-radius:12px;color:#8a9aab;font-size:12px;line-height:1.8}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#21364f;color:#fff;padding:14px 18px;border-radius:13px;box-shadow:0 12px 35px #112a4555;max-width:calc(100vw - 30px);min-width:250px;z-index:20;font-size:12px;font-weight:700;text-align:center}.hidden{display:none!important}.side-note{font-size:11px;color:#6d7d90;line-height:1.8}.highlight{color:var(--navy);font-weight:800}.statusbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.footer{color:#95a0ae;font-size:10px;text-align:center;margin-top:24px}.twocol{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tabs{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}.tab{padding:9px 12px;border:1px solid #dce5f0;border-radius:30px;background:#fff;color:#66809c;font-weight:800;font-size:12px}.tab.active{color:#fff;background:#205a9e;border-color:#205a9e}.filter{border:1px solid #e0e8f0;border-radius:10px;padding:9px 12px;background:white;color:#4b6177;font-size:12px}.price{font-variant-numeric:tabular-nums}.caution{color:#b36b0b}.audit{font-size:11px;color:#718195;border-left:2px solid #dce6f1;margin-left:6px;padding:5px 11px;line-height:1.65}.modal-back{position:fixed;inset:0;z-index:30;background:#12243988;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(500px,100%);max-height:90dvh;overflow:auto;background:white;padding:22px;border-radius:18px;box-shadow:0 20px 50px #0a203c50}.modal h2{font-size:18px}.alertline{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:9px;background:#fffaf1;color:#895d14;font-size:12px;margin:7px 0}.mini{font-size:10px}.photo{padding:10px;border:1px dashed #c8d7e6;border-radius:10px;color:#7690a7;background:#fafcfe;font-size:11px;margin-top:15px}.photo input{width:100%}.change-price{cursor:pointer;text-decoration:underline;text-underline-offset:3px}.stack{display:flex;flex-direction:column;gap:11px} @media(max-width:740px){.header{padding:13px 15px}.logo{font-size:18px}.pill.soft{display:none}.main{padding:17px 13px 80px}.h1{font-size:22px}.grid{grid-template-columns:1fr}.grid3{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{padding:15px}.stat{padding:13px 11px}.stat .number{font-size:19px}.stat label{font-size:10px}.roles{margin-bottom:16px}.role{font-size:11px;padding:12px 4px}.products{gap:7px}.product{padding:10px;min-height:73px}.pagehead{align-items:center}.subtitle{font-size:11px}.twocol{grid-template-columns:1fr 1fr}.footer{padding-bottom:25px}}
</style><meta name="robots" content="noindex,nofollow"></head><body><div class="shell"><header class="header"><div class="logo">ShakeHands<span>STOCK FLOW / DEMO</span></div><div class="header-right"><span class="pill">● 動作デモ</span><span class="pill soft">月額サービス不要</span></div></header><main class="main"><div class="pagehead"><div><div class="eyebrow">INVENTORY & BILLING</div><div class="h1">仕入・在庫・請求管理</div><div class="subtitle">スマホで納品登録 → 在庫更新 → 経理確認まで体験できます（公開サンプル）</div></div><button class="btn small secondary" onclick="resetDemo()">↺ 初期化</button></div><nav class="roles" id="roles"></nav><div id="app"></div><div class="footer">公開操作デモ｜在庫数量・価格・施設名は架空のサンプル｜データはこの端末のブラウザ内のみ保存｜本番未接続</div></main></div><div id="toast" class="toast hidden"></div><div id="modal" class="modal-back hidden"></div>
<script>
'use strict';
const KEY='shakehands-stockflow-public-demo-v1';
const products=[
{id:'p1',name:'アクア シャンプー 2L',unit:'本',stock:60,cost:1450,price:1850},
{id:'p2',name:'アクア ボディソープ 2L',unit:'本',stock:42,cost:1450,price:1850},
{id:'p3',name:'シルクウェル コンディショナー 18L',unit:'箱',stock:5,cost:7400,price:8900},
{id:'p4',name:'シルクウェル シャンプー 18L',unit:'箱',stock:6,cost:7400,price:8900},
{id:'p5',name:'シルクウェル ボディソープ 18L',unit:'箱',stock:4,cost:7400,price:8900},
{id:'p6',name:'アクア コンディショナー 2L',unit:'本',stock:9,cost:1450,price:1850},
{id:'p7',name:'クリーミーボディタオル',unit:'個',stock:210,cost:15,price:24},
{id:'p8',name:'使い捨てスリッパ',unit:'足',stock:160,cost:85,price:120},
{id:'p9',name:'カネヨ 柔軟剤',unit:'個',stock:8,cost:740,price:990},
{id:'p10',name:'カミソリ',unit:'個',stock:850,cost:18,price:30},
{id:'p11',name:'ヘアブラシ',unit:'個',stock:280,cost:24,price:39},
{id:'p12',name:'歯ブラシ',unit:'本',stock:500,cost:19,price:31}
];
const facilities=[{id:'f1',name:'デモ施設A｜恩納村',owner:'オーナーA'},{id:'f2',name:'デモ施設B｜名護市',owner:'オーナーB'},{id:'f3',name:'デモ施設C｜本部町',owner:'オーナーC'}];
function initial(){return {stock:Object.fromEntries(products.map(p=>[p.id,p.stock])),prices:Object.fromEntries(products.map(p=>[p.id,{cost:p.cost,bill:p.price}])),facilityStock:{},deliveries:[],orders:[],audit:[],seq:0}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.stock&&x.prices&&Array.isArray(x.deliveries))return x}catch(e){}return initial()}
let db=load(),role='clean',subtab='pending',cleanProduct='p12',cleanFacility='f1',cleanQty=20,staffProduct='p12',staffQty=100,staffCost=19,cleanPhoto=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function newId(prefix){return prefix+'-'+String(++db.seq).padStart(4,'0')}
function t(){return new Date().toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function audit(msg){db.audit.unshift(t()+'　'+msg);db.audit=db.audit.slice(0,120)}
function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pfind(id){return products.find(p=>p.id===id)}function ffind(id){return facilities.find(f=>f.id===id)}
function getPrice(p){return db.prices[p.id]}
function countUnbilled(){return db.deliveries.filter(d=>d.status!=='請求済').length}
function unbilledTotal(){return db.deliveries.filter(d=>d.status!=='請求済').reduce((a,d)=>a+(d.billPrice||0)*d.qty,0)}
function stockTotal(){return products.reduce((a,p)=>a+(db.stock[p.id]||0)*getPrice(p).cost,0)}
function notify(message,error=false){const el=document.getElementById('toast');el.textContent=message;el.style.background=error?'#a43d3d':'#173f72';el.classList.remove('hidden');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.classList.add('hidden'),3200)}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function showModal(content){const m=document.getElementById('modal');m.innerHTML='<div class="modal">'+content+'</div>';m.classList.remove('hidden');m.onclick=e=>{if(e.target===m)closeModal()}}
function stat(label,value,cls=''){return `<div class="stat"><label>${label}</label><div class="number ${cls}">${value}</div></div>`}
function empty(text){return `<div class="empty">${text}</div>`}
function setRole(r){role=r;subtab='pending';render()}
function setSubtab(s){subtab=s;render()}
function render(){document.getElementById('roles').innerHTML=[['clean','🧹 清掃会社'],['staff','📦 社内スタッフ'],['account','🧾 経理スタッフ']].map(([r,l])=>`<button class="role ${role===r?'active':''}" onclick="setRole('${r}')">${l}</button>`).join('');document.getElementById('app').innerHTML=role==='clean'?cleanView():role==='staff'?staffView():accountView()}
function productButtons(){return `<div class="products">${products.map(p=>`<button class="product ${cleanProduct===p.id?'active':''}" onclick="selectCleanProduct('${p.id}')"><span class="pname">${p.name}</span><span class="pmeta">倉庫残数 ${db.stock[p.id]||0}${p.unit}</span></button>`).join('')}</div>`}
function selectCleanProduct(id){cleanProduct=id;render()}
function cleanView(){let p=pfind(cleanProduct),latest=db.deliveries.slice().reverse().slice(0,4);return `<div class="grid3">${stat('登録済み納品',db.deliveries.length+'件')}${stat('未請求',countUnbilled()+'件',countUnbilled()?'warn':'')}${stat('未請求金額',yen(unbilledTotal()),countUnbilled()?'red':'')}</div><div class="grid" style="margin-top:16px"><section class="card"><div class="row between"><h2>施設に商品を納品する</h2><span class="tag blue">現場入力</span></div><p class="card-desc">施設と商品を選んで数量を入力。登録後、倉庫在庫が自動で減ります。</p><label class="field">① 納品先の施設</label><select onchange="cleanFacility=this.value">${facilities.map(f=>`<option value="${f.id}" ${cleanFacility===f.id?'selected':''}>${f.name}</option>`).join('')}</select><label class="field">② 商品を選ぶ</label>${productButtons()}<label class="field">③ 納品数量</label><div class="row between"><div class="qty"><button onclick="changeCleanQty(-1)">−</button><input type="number" min="1" step="1" inputmode="numeric" id="cleanQty" value="${cleanQty}" oninput="cleanQty=Number(this.value)"><button onclick="changeCleanQty(1)">＋</button></div><span class="muted">${p.unit}／倉庫残 ${db.stock[p.id]}${p.unit}</span></div><div class="photo"><div>📷 納品写真（任意）</div><input type="file" accept="image/*" capture="environment" onchange="cleanPhoto=!!this.files.length"></div><div class="notice">ℹ️ 登録時点では「納品済み・請求未確定」となります。経理スタッフの確認後に請求済みになります。</div><button class="btn full" onclick="deliver()">納品を登録する →</button></section><section><div class="card"><div class="row between"><h2>直近の納品履歴</h2><span class="tag">${latest.length}件表示</span></div><p class="card-desc">清掃会社には仕入単価・販売単価を表示しません。</p><div class="list">${latest.length?latest.map(d=>`<div class="item"><div class="row between"><span class="item-title">${pfind(d.pid).name}</span><span class="tag ${d.status==='請求済'?'green':'amber'}">${d.status}</span></div><div class="item-detail">${ffind(d.fid).name}・${d.qty}${pfind(d.pid).unit}<br>${d.id}｜${d.date}</div></div>`).join(''):empty('まだ納品記録がありません。<br>左側のフォームから登録してください。')}</div></div><div class="card"><h2>使い方</h2><div class="side-note">1. 施設を選択<br>2. 商品と数量を入力<br>3. 「納品を登録する」を押す<br>4. 上部の「経理スタッフ」へ切り替える<br>5. 未請求として表示されることを確認</div></div></section></div>`}
function changeCleanQty(n){cleanQty=Math.max(1,(Number(document.getElementById('cleanQty')?.value)||0)+n);document.getElementById('cleanQty').value=cleanQty}
function deliver(){const p=pfind(cleanProduct),q=Number(document.getElementById('cleanQty').value);if(!Number.isSafeInteger(q)||q<1){notify('数量は1以上の整数で入力してください',true);return}if(q>db.stock[p.id]){notify(`在庫不足：倉庫残は${db.stock[p.id]}${p.unit}です`,true);return}const price=getPrice(p).bill;const d={id:newId('DLV'),fid:cleanFacility,pid:p.id,qty:q,date:t(),status:'未請求',billPrice:price,costPrice:getPrice(p).cost,actor:'清掃会社',photo:cleanPhoto};db.stock[p.id]-=q;const k=cleanFacility+':'+p.id;db.facilityStock[k]=(db.facilityStock[k]||0)+q;db.deliveries.unshift(d);audit(`清掃会社：${ffind(cleanFacility).name}に${p.name}を${q}${p.unit}納品登録（${d.id}）`);save();cleanPhoto=false;render();notify(`納品登録完了！倉庫在庫 −${q}${p.unit}／未請求 +1件`)}
function staffView(){const open=db.orders.filter(o=>o.status==='発注済');const received=db.orders.filter(o=>o.status==='入荷済');return `<div class="grid3">${stat('発注待ち入荷',open.length+'件',open.length?'warn':'')}${stat('仕入履歴',received.length+'件')}${stat('倉庫在庫評価',yen(stockTotal()))}</div><div class="grid" style="margin-top:16px"><section class="card"><div class="row between"><h2>商品の発注を登録</h2><span class="tag blue">発注入力</span></div><p class="card-desc">発注後、「入庫する」で実際の入荷数量・仕入単価を確定します。</p><label class="field">商品</label><select id="orderProduct" onchange="staffProduct=this.value;document.getElementById('orderPrice').value=getPrice(pfind(this.value)).cost">${products.map(p=>`<option value="${p.id}" ${staffProduct===p.id?'selected':''}>${p.name}</option>`).join('')}</select><div class="twocol"><div><label class="field">発注数量</label><input class="input" id="orderQty" type="number" min="1" step="1" inputmode="numeric" value="${staffQty}"></div><div><label class="field">予定仕入単価（仮）</label><input class="input" id="orderPrice" type="number" min="0" step="1" inputmode="numeric" value="${getPrice(pfind(staffProduct)).cost}"></div></div><p class="side-note">※商品価格はすべてデモ用の仮価格。正式な価格ではありません。</p><button class="btn full" onclick="addOrder()">発注登録する →</button></section><section><div class="card"><h2>入荷待ちの発注</h2><p class="card-desc">納品が届いたら「入庫する」を押して受領確認します。</p><div class="list">${open.length?open.map(o=>`<div class="item"><div class="row between"><div class="item-title">${pfind(o.pid).name}</div><span class="tag amber">発注済</span></div><div class="item-detail">${o.id}｜${o.qty}${pfind(o.pid).unit}｜予定 ${yen(o.expectedPrice)}/${pfind(o.pid).unit}<br>${o.date}</div><div style="margin-top:10px"><button class="btn small" onclick="receiveOpen('${o.id}')">入庫する</button></div></div>`).join(''):empty('入荷待ちの発注はありません')}</div></div><div class="card"><h2>入庫後の履歴</h2><div class="list">${received.slice(0,5).length?received.slice(0,5).map(o=>`<div class="item"><div class="row between"><span class="item-title">${pfind(o.pid).name}</span><span class="tag ${o.reviewed?'green':'amber'}">${o.reviewed?'経理確認済':'経理未確認'}</span></div><div class="item-detail">${o.id}｜入庫 ${o.receivedQty}${pfind(o.pid).unit}｜実単価 ${yen(o.actualPrice)}</div></div>`).join(''):empty('入庫記録はありません')}</div></div></section></div><div class="card" style="margin-top:16px"><div class="row between"><h2>デモ倉庫の在庫一覧</h2><span class="tag">全${products.length}商品</span></div><div class="tablewrap"><table class="table"><thead><tr><th>商品</th><th>数量</th><th>参考仕入単価</th><th>参考請求単価</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${db.stock[p.id]||0}${p.unit}</td><td>${yen(getPrice(p).cost)}</td><td>${yen(getPrice(p).bill)}</td></tr>`).join('')}</tbody></table></div><p class="side-note">初期在庫はデモ倉庫の確認値。金額はすべて実データではなく仮の値です。</p></div>`}
function addOrder(){const p=pfind(document.getElementById('orderProduct').value),q=Number(document.getElementById('orderQty').value),price=Number(document.getElementById('orderPrice').value);if(!Number.isSafeInteger(q)||q<1||!Number.isFinite(price)||price<0){notify('数量と予定単価を正しく入力してください',true);return}staffProduct=p.id;staffQty=q;const o={id:newId('PO'),pid:p.id,qty:q,expectedPrice:price,status:'発注済',date:t(),reviewed:false};db.orders.unshift(o);audit(`社内スタッフ：${p.name} ${q}${p.unit}を発注（${o.id}）`);save();render();notify('発注登録しました。「入庫する」で在庫へ反映できます')}
function receiveOpen(id){let o=db.orders.find(o=>o.id===id);if(!o||o.status!=='発注済')return;let p=pfind(o.pid);showModal(`<h2>入庫・検品</h2><p class="card-desc">${p.name} / ${o.id}<br>予定数量 ${o.qty}${p.unit} ・ 予定単価 ${yen(o.expectedPrice)}</p><label class="field">実際の入荷数量</label><input id="receivedQty" class="input" inputmode="numeric" type="number" min="0" value="${o.qty}"><label class="field">実際の仕入単価（仮）</label><input id="receivedPrice" class="input" inputmode="numeric" type="number" min="0" value="${o.expectedPrice}"><div class="notice warn">⚠️ 発注数量・仕入単価が違えば経理側に差異が表示されます。</div><div class="row"><button class="btn secondary" onclick="closeModal()">閉じる</button><button class="btn" style="flex:1" onclick="receiveOrder('${id}')">入庫を確定</button></div>`)}
function receiveOrder(id){let o=db.orders.find(o=>o.id===id);if(!o||o.status!=='発注済')return;const q=Number(document.getElementById('receivedQty').value),price=Number(document.getElementById('receivedPrice').value);if(!Number.isSafeInteger(q)||q<0||!Number.isFinite(price)||price<0){notify('数量・単価を確認してください',true);return}o.receivedQty=q;o.actualPrice=price;o.status='入荷済';o.reviewed=false;o.receivedAt=t();db.stock[o.pid]+=q;audit(`社内スタッフ：${pfind(o.pid).name} ${q}${pfind(o.pid).unit}を入庫（${o.id}）`);save();closeModal();render();notify('入庫確定！在庫に加算し、経理確認待ちにしました')}
function accountView(){const waiting=db.deliveries.filter(d=>d.status!=='請求済'),invoices=db.deliveries.filter(d=>d.status==='請求済'),notchecked=db.orders.filter(o=>o.status==='入荷済'&&!o.reviewed);const diffs=notchecked.filter(o=>o.receivedQty!==o.qty||o.actualPrice!==o.expectedPrice).length;return `<div class="grid3">${stat('未請求',waiting.length+'件',waiting.length?'red':'')}${stat('未請求金額',yen(unbilledTotal()),waiting.length?'warn':'')}${stat('仕入要確認',notchecked.length+'件',notchecked.length?'warn':'')}</div><div class="card" style="margin-top:16px"><div class="row between"><div><h2>経理ダッシュボード</h2><p class="card-desc" style="margin-bottom:6px">納品・発注データを照合して請求漏れを防止します。</p></div><span class="tag blue">ダブルチェック</span></div><div class="tabs"><button class="tab ${subtab==='pending'?'active':''}" onclick="setSubtab('pending')">未請求 ${waiting.length}</button><button class="tab ${subtab==='purchase'?'active':''}" onclick="setSubtab('purchase')">仕入照合 ${notchecked.length}</button><button class="tab ${subtab==='invoiced'?'active':''}" onclick="setSubtab('invoiced')">請求済 ${invoices.length}</button><button class="tab ${subtab==='prices'?'active':''}" onclick="setSubtab('prices')">単価設定</button><button class="tab ${subtab==='audit'?'active':''}" onclick="setSubtab('audit')">操作履歴</button></div>${subtab==='pending'?pendingView(waiting):subtab==='purchase'?purchasesView(notchecked):subtab==='invoiced'?invoicedView(invoices):subtab==='prices'?pricesView():auditView()}</div>`}
function pendingView(waiting){let invalid=waiting.filter(d=>!d.billPrice||d.billPrice<d.costPrice);return `<div class="notice ${waiting.length?'warn':''}">🔎 納品済み未請求：${waiting.length}件 / ${yen(unbilledTotal())}。請求単価が仕入原価を下回る場合は警告します。</div>${invalid.length?`<div class="alertline">⚠️ 要確認：${invalid.length}件で請求単価未設定または原価割れがあります。</div>`:''}<div class="list">${waiting.length?waiting.map(d=>`<div class="item"><div class="row between"><div class="item-title">${pfind(d.pid).name}</div><span class="tag amber">未請求</span></div><div class="item-detail">${d.id}｜${ffind(d.fid).name}（${ffind(d.fid).owner}）<br>${d.qty}${pfind(d.pid).unit} × ${yen(d.billPrice)} ＝ <b class="highlight">${yen(d.qty*d.billPrice)}</b><br>仕入参考 ${yen(d.costPrice)} / ${pfind(d.pid).unit} ・ ${d.date}</div>${d.billPrice<d.costPrice?`<div class="alertline">⚠️ 請求単価が仕入原価を下回っています</div>`:''}<div style="margin-top:10px" class="row"><button class="btn small" onclick="invoiceDelivery('${d.id}')">照合OK・請求確定</button></div></div>`).join(''):empty('未請求はありません。<br>清掃会社の画面で納品登録すると、ここへ表示されます。')}</div>`}
function invoiceDelivery(id){const d=db.deliveries.find(x=>x.id===id);if(!d||d.status==='請求済'){notify('すでに請求済みです',true);return}if(!d.billPrice||d.billPrice<d.costPrice){notify('請求単価を確認・修正してください',true);return}d.status='請求済';d.invoiceId=newId('INV');d.invoicedAt=t();audit(`経理スタッフ：${d.id} を照合し請求確定（${d.invoiceId} / ${yen(d.qty*d.billPrice)}）`);save();render();notify(`請求確定 ${d.invoiceId}（デモ：外部送信はしていません）`)}
function purchasesView(orders){return `<div class="notice">🧾 発注数量・予定単価と、入荷数量・実仕入単価を照合します。差異は確認時に表示します。</div><div class="list">${orders.length?orders.map(o=>{let mismatch=o.qty!==o.receivedQty||o.expectedPrice!==o.actualPrice;return `<div class="item"><div class="row between"><div class="item-title">${pfind(o.pid).name}</div><span class="tag ${mismatch?'red':'amber'}">${mismatch?'差異あり':'未確認'}</span></div><div class="item-detail">${o.id}<br>数量：発注 ${o.qty} / 入荷 ${o.receivedQty} ${pfind(o.pid).unit}<br>単価：予定 ${yen(o.expectedPrice)} / 実際 ${yen(o.actualPrice)}</div>${mismatch?'<div class="alertline">⚠️ 発注内容と入庫実績に差異があります。内容確認後に承認してください。</div>':''}<div style="margin-top:10px"><button class="btn small" onclick="approvePurchase('${o.id}')">内容確認済みとして承認</button></div></div>`}).join(''):empty('仕入照合の待機データはありません。<br>社内スタッフ画面から発注・入庫を試してください。')}</div>`}
function approvePurchase(id){const o=db.orders.find(x=>x.id===id);if(!o||o.status!=='入荷済'||o.reviewed)return;o.reviewed=true;db.prices[o.pid].cost=o.actualPrice;audit(`経理スタッフ：仕入 ${o.id} を承認し、参考仕入単価を${yen(o.actualPrice)}に更新`);save();render();notify('仕入照合を承認しました')}
function invoicedView(invoices){return `<div class="notice">✅ 請求確定済みの明細です。外部への請求書発行・送信はまだ行われません。</div><div class="list">${invoices.length?invoices.map(d=>`<div class="item"><div class="row between"><span class="item-title">${pfind(d.pid).name}</span><span class="tag green">請求済</span></div><div class="item-detail">${d.invoiceId}｜${ffind(d.fid).name}<br>${d.qty}${pfind(d.pid).unit} × ${yen(d.billPrice)} ＝ <b>${yen(d.qty*d.billPrice)}</b><br>承認 ${d.invoicedAt}</div></div>`).join(''):empty('請求確定済み明細はありません')}</div>`}
function pricesView(){return `<div class="notice warn">⚠️ このデモの単価はすべて説明用の仮価格です。実際の仕入価格・契約上の請求価格ではありません。</div><div class="tablewrap"><table class="table"><thead><tr><th>商品</th><th>参考原価</th><th>請求単価</th><th>変更</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.name}</td><td>${yen(getPrice(p).cost)}</td><td>${yen(getPrice(p).bill)}</td><td><button class="btn small secondary" onclick="editPrice('${p.id}')">編集</button></td></tr>`).join('')}</tbody></table></div><p class="side-note">単価を変更しても過去の納品明細は書き換えません。新しい納品から変更単価が使われます。</p>`}
function editPrice(id){const p=pfind(id),x=getPrice(p);showModal(`<h2>価格設定</h2><p class="card-desc">${p.name}・${p.unit}単位</p><label class="field">参考仕入原価</label><input id="editCost" class="input" type="number" min="0" step="1" value="${x.cost}"><label class="field">請求単価</label><input id="editBill" class="input" type="number" min="0" step="1" value="${x.bill}"><div class="notice warn">⚠️ 請求単価が原価より低い場合は、新しい納品明細に警告が出ます。</div><div class="row"><button class="btn secondary" onclick="closeModal()">閉じる</button><button class="btn" style="flex:1" onclick="savePrice('${p.id}')">変更を保存</button></div>`)}
function savePrice(id){const c=Number(document.getElementById('editCost').value),b=Number(document.getElementById('editBill').value);if(!Number.isFinite(c)||!Number.isFinite(b)||c<0||b<0){notify('価格は0以上で入力してください',true);return}const prev=getPrice(pfind(id));audit(`経理スタッフ：${pfind(id).name} 原価 ${yen(prev.cost)}→${yen(c)} / 請求単価 ${yen(prev.bill)}→${yen(b)} に変更`);db.prices[id]={cost:c,bill:b};save();closeModal();render();notify('単価設定を保存しました（新規納品に適用）')}
function auditView(){return `<div class="list">${db.audit.length?db.audit.map(line=>`<div class="audit">${esc(line)}</div>`).join(''):empty('まだ操作履歴はありません')}</div>`}
function resetDemo(){showModal(`<h2>デモを初期化しますか？</h2><p class="card-desc">この端末内に保存した発注・納品・請求データはすべてリセットされます。</p><div class="row"><button class="btn secondary" onclick="closeModal()">キャンセル</button><button class="btn" style="flex:1" onclick="confirmReset()">初期状態に戻す</button></div>`)}
function confirmReset(){db=initial();cleanProduct='p12';cleanFacility='f1';cleanQty=20;cleanPhoto=false;staffProduct='p12';staffQty=100;role='clean';subtab='pending';save();closeModal();render();notify('デモを初期化しました')}
render();
</script></body></html>
